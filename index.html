<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Arena</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      background: rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    #startButton {
      padding: 16px 32px;
      border: 0;
      border-radius: 8px;
      background: #e63946;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #startButton:hover {
      background: #ff5361;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 5;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: white;
    }

    #crosshair::before {
      left: 8px;
      top: 0;
      width: 2px;
      height: 18px;
    }

    #crosshair::after {
      left: 0;
      top: 8px;
      width: 18px;
      height: 2px;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 5;
      color: white;
      font-size: 18px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="menu">
    <h1>Bot Arena</h1>
    <p>WASD to move</p>
    <p>Mouse to aim</p>
    <p>Left-click to shoot</p>
    <button id="startButton">Start Game</button>
  </div>

  <div id="crosshair"></div>
  <div id="hud">Score: 0</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from
      "three/addons/controls/PointerLockControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 1.6, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
    scene.add(light);

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(30, 0.2, 30),
      new THREE.MeshStandardMaterial({ color: 0x2e8b57 })
    );

    ground.position.y = -1;
    scene.add(ground);

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x555555
    });

    function createWall(x, y, z, width, height, depth) {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        wallMaterial
      );

      wall.position.set(x, y, z);
      scene.add(wall);
    }

    createWall(0, 1, -15, 30, 4, 1);
    createWall(0, 1, 15, 30, 4, 1);
    createWall(-15, 1, 0, 1, 4, 30);
    createWall(15, 1, 0, 1, 4, 30);

    const bots = [];

    function createBot(x, z) {
      const bot = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2, 1),
        new THREE.MeshStandardMaterial({ color: 0xff3333 })
      );

      bot.position.set(x, 0, z);
      bot.userData.isBot = true;
      scene.add(bot);
      bots.push(bot);
    }

    createBot(-6, -4);
    createBot(0, -6);
    createBot(6, -4);

    const menu = document.getElementById("menu");
    const startButton = document.getElementById("startButton");
    const hud = document.getElementById("hud");

    let score = 0;
    const keys = {};

    startButton.addEventListener("click", () => {
      controls.lock();
    });

    controls.addEventListener("lock", () => {
      menu.style.display = "none";
    });

    controls.addEventListener("unlock", () => {
      menu.style.display = "flex";
    });

    window.addEventListener("keydown", event => {
      keys[event.code] = true;
    });

    window.addEventListener("keyup", event => {
      keys[event.code] = false;
    });

    const raycaster = new THREE.Raycaster();

    window.addEventListener("mousedown", event => {
      if (!controls.isLocked || event.button !== 0) return;

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const hits = raycaster.intersectObjects(bots);

      if (hits.length > 0) {
        const bot = hits[0].object;

        scene.remove(bot);
        bots.splice(bots.indexOf(bot), 1);

        score += 100;
        hud.textContent = `Score: ${score}`;
      }
    });

    const clock = new THREE.Clock();

    function gameLoop() {
      const delta = clock.getDelta();
      const speed = 6 * delta;

      if (controls.isLocked) {
        if (keys["KeyW"]) controls.moveForward(speed);
        if (keys["KeyS"]) controls.moveForward(-speed);
        if (keys["KeyA"]) controls.moveRight(-speed);
        if (keys["KeyD"]) controls.moveRight(speed);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    gameLoop();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
