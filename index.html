<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Arena</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      background: rgba(0, 0, 0, 0.82);
      text-align: center;
    }

    #menu h1 {
      margin: 0 0 12px;
      font-size: 44px;
    }

    #menu p {
      margin: 6px;
      color: #ddd;
    }

    #difficulty {
      display: flex;
      gap: 10px;
      margin: 22px 0;
    }

    #difficulty button,
    #startButton {
      border: 0;
      border-radius: 7px;
      padding: 13px 20px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #difficulty button {
      background: #444;
    }

    #difficulty button.selected {
      background: #e63946;
    }

    #startButton {
      background: #238636;
      font-size: 19px;
      padding: 14px 30px;
    }

    #startButton:hover {
      background: #2ea043;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 5;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: white;
    }

    #crosshair::before {
      left: 8px;
      top: 0;
      width: 2px;
      height: 18px;
    }

    #crosshair::after {
      left: 0;
      top: 8px;
      width: 18px;
      height: 2px;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 5;
      color: white;
      font-size: 18px;
      line-height: 1.6;
      pointer-events: none;
      text-shadow: 1px 1px 3px black;
    }

    #message {
      position: fixed;
      left: 50%;
      top: 20%;
      z-index: 6;
      transform: translateX(-50%);
      color: white;
      font-size: 32px;
      text-shadow: 2px 2px 4px black;
      pointer-events: none;
    }

    #damageFlash {
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(255, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
    }

    #warning {
      position: fixed;
      left: 50%;
      bottom: 12%;
      z-index: 5;
      transform: translateX(-50%);
      color: #ff5555;
      font-size: 20px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      text-shadow: 1px 1px 3px black;
    }
  </style>
</head>

<body>
  <div id="menu">
    <h1>Bot Arena</h1>
    <p>WASD: move</p>
    <p>Mouse: aim</p>
    <p>Left click: shoot</p>
    <p>Escape: pause</p>

    <div id="difficulty">
      <button data-level="easy" class="selected">Easy</button>
      <button data-level="regular">Regular</button>
      <button data-level="expert">Expert</button>
    </div>

    <button id="startButton">Start Game</button>
  </div>

  <div id="crosshair"></div>

  <div id="hud">
    Score: <span id="score">0</span><br>
    Bots left: <span id="botsLeft">0</span><br>
    Time: <span id="time">60</span><br>
    Health: <span id="health">100</span>
  </div>

  <div id="message"></div>
  <div id="warning">INCOMING FIRE!</div>
  <div id="damageFlash"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { PointerLockControls } from
      "three/addons/controls/PointerLockControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 1.6, 8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);

    const menu = document.getElementById("menu");
    const startButton = document.getElementById("startButton");
    const scoreText = document.getElementById("score");
    const botsLeftText = document.getElementById("botsLeft");
    const timeText = document.getElementById("time");
    const healthText = document.getElementById("health");
    const message = document.getElementById("message");
    const damageFlash = document.getElementById("damageFlash");
    const warning = document.getElementById("warning");

    const light = new THREE.HemisphereLight(
      0xffffff,
      0x444444,
      3
    );

    scene.add(light);

    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(5, 10, 5);
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(30, 0.2, 30),
      new THREE.MeshStandardMaterial({
        color: 0x2e8b57
      })
    );

    ground.position.y = -1;
    scene.add(ground);

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x555555
    });

    function createWall(x, y, z, width, height, depth) {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        wallMaterial
      );

      wall.position.set(x, y, z);
      scene.add(wall);
    }

    createWall(0, 1, -15, 30, 4, 1);
    createWall(0, 1, 15, 30, 4, 1);
    createWall(-15, 1, 0, 1, 4, 30);
    createWall(15, 1, 0, 1, 4, 30);

    const bots = [];
    const projectiles = [];

    const settings = {
      easy: {
        count: 3,
        speed: 1.2,
        turnTime: 2.5,
        attackDelay: 4,
        attackRange: 16,
        projectileSpeed: 7,
        damage: 5,
        points: 100
      },

      regular: {
        count: 5,
        speed: 2,
        turnTime: 1.5,
        attackDelay: 2.5,
        attackRange: 18,
        projectileSpeed: 10,
        damage: 10,
        points: 150
      },

      expert: {
        count: 8,
        speed: 3,
        turnTime: 0.8,
        attackDelay: 1.2,
        attackRange: 22,
        projectileSpeed: 14,
        damage: 15,
        points: 250
      }
    };

    let selectedDifficulty = "easy";
    let score = 0;
    let timeRemaining = 60;
    let playerHealth = 100;
    let gameRunning = false;
    let damageFlashTimer = 0;
    let warningTimer = 0;

    document.querySelectorAll("#difficulty button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("#difficulty button").forEach(other => {
          other.classList.remove("selected");
        });

        button.classList.add("selected");
        selectedDifficulty = button.dataset.level;
      });
    });

    function randomArenaPosition() {
      return {
        x: THREE.MathUtils.randFloat(-11, 11),
        z: THREE.MathUtils.randFloat(-11, 4)
      };
    }

    function createBot() {
      const bot = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2, 1),
        new THREE.MeshStandardMaterial({
          color: 0xff3333
        })
      );

      const position = randomArenaPosition();

      bot.position.set(position.x, 0, position.z);

      bot.userData.isBot = true;
      bot.userData.direction = Math.random() * Math.PI * 2;
      bot.userData.turnTimer = Math.random() * 2;
      bot.userData.attackTimer = 1 + Math.random() * 2;

      scene.add(bot);
      bots.push(bot);
    }

    function removeAllBots() {
      while (bots.length > 0) {
        const bot = bots.pop();

        scene.remove(bot);
        bot.geometry.dispose();
        bot.material.dispose();
      }
    }

    function removeAllProjectiles() {
      while (projectiles.length > 0) {
        const projectile = projectiles.pop();

        scene.remove(projectile.mesh);
        projectile.mesh.geometry.dispose();
        projectile.mesh.material.dispose();
      }
    }

    function spawnBots() {
      const difficulty = settings[selectedDifficulty];

      for (let i = 0; i < difficulty.count; i++) {
        createBot();
      }
    }

    function updateHud() {
      scoreText.textContent = score;
      botsLeftText.textContent = bots.length;
      timeText.textContent = Math.max(
        0,
        Math.ceil(timeRemaining)
      );
      healthText.textContent = Math.max(
        0,
        Math.ceil(playerHealth)
      );
    }

    function showDamageEffect() {
      damageFlashTimer = 0.25;
      damageFlash.style.opacity = "1";
    }

    function createProjectile(bot) {
      const projectileGeometry = new THREE.SphereGeometry(
        0.12,
        12,
        12
      );

      const projectileMaterial = new THREE.MeshBasicMaterial({
        color: 0xff2200
      });

      const projectile = new THREE.Mesh(
        projectileGeometry,
        projectileMaterial
      );

      const start = bot.position.clone();
      start.y = 1;

      projectile.position.copy(start);
      scene.add(projectile);

      const target = controls.object.position.clone();
      target.y = 1.5;

      const direction = target.sub(start).normalize();

      projectiles.push({
        mesh: projectile,
        direction: direction,
        speed: settings[selectedDifficulty].projectileSpeed,
        damage: settings[selectedDifficulty].damage,
        life: 5
      });

      warningTimer = 0.5;
      warning.style.opacity = "1";
    }

    function updateProjectiles(delta) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const projectile = projectiles[i];

        projectile.mesh.position.addScaledVector(
          projectile.direction,
          projectile.speed * delta
        );

        projectile.life -= delta;

        const distanceToPlayer =
          projectile.mesh.position.distanceTo(
            controls.object.position
          );

        if (distanceToPlayer < 0.8) {
          playerHealth -= projectile.damage;

          showDamageEffect();

          scene.remove(projectile.mesh);
          projectile.mesh.geometry.dispose();
          projectile.mesh.material.dispose();
          projectiles.splice(i, 1);

          if (playerHealth <= 0) {
            playerHealth = 0;
            updateHud();
            endRound("YOU LOST!");
            return;
          }

          updateHud();
          continue;
        }

        if (
          projectile.life <= 0 ||
          Math.abs(projectile.mesh.position.x) > 30 ||
          Math.abs(projectile.mesh.position.z) > 30
        ) {
          scene.remove(projectile.mesh);
          projectile.mesh.geometry.dispose();
          projectile.mesh.material.dispose();
          projectiles.splice(i, 1);
        }
      }
    }

    function endRound(text) {
      gameRunning = false;
      message.textContent = text;
      startButton.textContent = "Play Again";
      controls.unlock();
    }

    function startGame() {
      removeAllBots();
      removeAllProjectiles();

      score = 0;
      timeRemaining = 60;
      playerHealth = 100;
      gameRunning = true;

      damageFlashTimer = 0;
      warningTimer = 0;
      damageFlash.style.opacity = "0";
      warning.style.opacity = "0";
      message.textContent = "";
      startButton.textContent = "Start Game";

      camera.position.set(0, 1.6, 8);

      spawnBots();
      updateHud();

      controls.lock();
    }

    startButton.addEventListener("click", startGame);

    controls.addEventListener("lock", () => {
      menu.style.display = "none";
    });

    controls.addEventListener("unlock", () => {
      if (!gameRunning) {
        menu.style.display = "flex";
      }
    });

    const keys = {};

    window.addEventListener("keydown", event => {
      keys[event.code] = true;
    });

    window.addEventListener("keyup", event => {
      keys[event.code] = false;
    });

    const raycaster = new THREE.Raycaster();

    window.addEventListener("mousedown", event => {
      if (!gameRunning || !controls.isLocked) return;
      if (event.button !== 0) return;

      raycaster.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
      );

      const hits = raycaster.intersectObjects(bots);

      if (hits.length === 0) return;

      const bot = hits[0].object;
      const index = bots.indexOf(bot);

      if (index === -1) return;

      scene.remove(bot);
      bots.splice(index, 1);

      bot.geometry.dispose();
      bot.material.dispose();

      score += settings[selectedDifficulty].points;
      updateHud();

      if (bots.length === 0) {
        endRound("ROUND WON!");
      }
    });

    const clock = new THREE.Clock();

    function updateBots(delta) {
      const difficulty = settings[selectedDifficulty];

      for (const bot of bots) {
        bot.userData.turnTimer -= delta;
        bot.userData.attackTimer -= delta;

        if (bot.userData.turnTimer <= 0) {
          bot.userData.direction =
            Math.random() * Math.PI * 2;

          bot.userData.turnTimer =
            difficulty.turnTime *
            (0.7 + Math.random() * 0.6);
        }

        bot.position.x +=
          Math.sin(bot.userData.direction) *
          difficulty.speed *
          delta;

        bot.position.z +=
          Math.cos(bot.userData.direction) *
          difficulty.speed *
          delta;

        bot.position.x = THREE.MathUtils.clamp(
          bot.position.x,
          -13,
          13
        );

        bot.position.z = THREE.MathUtils.clamp(
          bot.position.z,
          -13,
          13
        );

        bot.rotation.y += delta;

        const distance = bot.position.distanceTo(
          controls.object.position
        );

        if (
          distance <= difficulty.attackRange &&
          bot.userData.attackTimer <= 0
        ) {
          createProjectile(bot);
          bot.userData.attackTimer =
            difficulty.attackDelay;
        }
      }
    }

    function gameLoop() {
      const rawDelta = clock.getDelta();
      const delta = Math.min(rawDelta, 0.1);

      if (damageFlashTimer > 0) {
        damageFlashTimer -= delta;

        if (damageFlashTimer <= 0) {
          damageFlashTimer = 0;
          damageFlash.style.opacity = "0";
        }
      }

      if (warningTimer > 0) {
        warningTimer -= delta;

        if (warningTimer <= 0) {
          warningTimer = 0;
          warning.style.opacity = "0";
        }
      }

      if (gameRunning && controls.isLocked) {
        const speed = 6 * delta;

        if (keys["KeyW"]) {
          controls.moveForward(speed);
        }

        if (keys["KeyS"]) {
          controls.moveForward(-speed);
        }

        if (keys["KeyA"]) {
          controls.moveRight(-speed);
        }

        if (keys["KeyD"]) {
          controls.moveRight(speed);
        }

        updateBots(delta);
        updateProjectiles(delta);

        timeRemaining -= delta;

        if (timeRemaining <= 0 && gameRunning) {
          timeRemaining = 0;
          updateHud();
          endRound("TIME UP!");
        }

        updateHud();
      }

      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    gameLoop();

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>
</body>
</html>
