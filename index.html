<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My 3D Game</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 3, 6);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
    scene.add(light);

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.2, 10),
      new THREE.MeshStandardMaterial({ color: 0x228b22 })
    );

    ground.position.y = -1;
    scene.add(ground);

    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );

    scene.add(player);

    const keys = {};

    window.addEventListener("keydown", function(event) {
      keys[event.key] = true;
    });

    window.addEventListener("keyup", function(event) {
      keys[event.key] = false;
    });

    function gameLoop() {
      if (keys["ArrowUp"]) player.position.z -= 0.05;
      if (keys["ArrowDown"]) player.position.z += 0.05;
      if (keys["ArrowLeft"]) player.position.x -= 0.05;
      if (keys["ArrowRight"]) player.position.x += 0.05;

      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 6;
      camera.lookAt(player.position);

      renderer.render(scene, camera);
      requestAnimationFrame(gameLoop);
    }

    gameLoop();

    window.addEventListener("resize", function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
